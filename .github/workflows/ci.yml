name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: handrix
          POSTGRES_PASSWORD: handrix
          POSTGRES_DB: handrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U handrix -d handrix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Backend
      DATABASE_URL: postgresql://handrix:handrix@127.0.0.1:5432/handrix?schema=public
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173
      # Frontend
      VITE_API_BASE_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify shared contracts
        run: pnpm ci:contracts

      - name: Verify frontend
        run: pnpm ci:frontend

      - name: Verify backend
        run: pnpm ci:backend
